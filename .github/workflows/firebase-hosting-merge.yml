name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - feature/core-v2
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # instalar Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cd ta_ui_new
          flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DANASSISTANT_D00BD }}
          channelId: live
          projectId: danassistant-d00bd
          entryPoint: ta_ui_new
